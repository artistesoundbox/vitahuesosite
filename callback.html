<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vitamina Hueso – Signing in…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at top, #1b2a3d 0%, #05070b 60%, #000000 100%);
      color: #cfe4ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .box { text-align: center; padding: 24px; max-width: 560px; }
    .spinner {
      width: 46px; height: 46px;
      margin: 0 auto 18px;
      border: 3px solid rgba(120, 180, 255, 0.25);
      border-top-color: #9fc5ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #msg { letter-spacing: 0.2em; text-transform: uppercase; font-size: 14px; line-height: 1.7; }
    a { color: #9fc5ff; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div id="msg">Signing you in…</div>
  </div>

  <!-- Same logic as auth/callback.html, but at the site root so Auth0's
       pinned callback URL (https://anthonitus.com/callback.html) always
       lands on the domain players started from. -->
  <script src="auth.js"></script>
  <script>
    const q = new URLSearchParams(window.location.search);
    if (q.get('error')) {
      document.querySelector('.spinner').style.display = 'none';
      const m = document.getElementById('msg');
      m.innerHTML =
        '<b>Login failed:</b> ' + q.get('error_description') +
        '<br><br><a href="index.html">&larr; back to the portal</a>';
      m.style.letterSpacing = 'normal';
      m.style.textTransform = 'none';
    } else {
      finishLogin();
    }
  </script>
</body>
</html>
