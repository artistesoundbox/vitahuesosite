<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->

    <script>
      window.dataLayer = window.dataLayer || [];

  <meta charset="UTF-8" />
  <title>Vitamina Hueso @ Manteca Studios – Silent Sound Theater</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#04070d" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      background: #04070d;
      color: #cfe4ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 34px 6vw 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* The icon art as the page masthead — same glow language as the portal */
    .masthead {
      display: block;
      line-height: 0;
      margin-bottom: 10px;
    }
    .masthead img {
      display: block;
      margin: 0 auto;
      width: min(340px, 78vw);
      height: auto;
      border-radius: 18px;
      filter: drop-shadow(0 0 14px rgba(80, 150, 255, 0.35));
    }
    h1 {
      margin: 18px 0 6px;
      font-size: clamp(20px, 4.6vw, 30px);
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #e8f2ff;
      text-align: center;
      text-shadow: 0 0 18px rgba(80, 150, 255, 0.45);
    }
    .tagline {
      margin-bottom: 26px;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #7f93ad;
      text-align: center;
    }
    /* Theater screen: 16:9 frame, first video is a lazy YouTube embed */
    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 1px solid rgba(120, 180, 255, 0.35);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(80, 150, 255, 0.18);
    }
    .screen iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .entry-meta {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      gap: 12px;
      margin: 10px 2px 26px;
    }
    .entry-note {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #66788f;
      white-space: nowrap;
    }
    .back-link {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 40px;
      font-size: 13px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #cfe4ff;
      background: rgba(8, 14, 24, 0.6);
      border: 1px solid rgba(120, 180, 255, 0.6);
      border-radius: 999px;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .back-link:hover {
      color: #ffffff;
      background: rgba(20, 40, 70, 0.85);
      border-color: rgba(160, 210, 255, 0.95);
      box-shadow: 0 0 26px rgba(80, 150, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="masthead" href="index.html" aria-label="Back to the portal">
      <img src="silent.sound.theater.icon.png?v=3" alt="Silent Sound Theater" />
    </a>
    <h1>Silent Sound Theater</h1>
    <div class="tagline">films made of music &middot; no dialogue &middot; all atmosphere</div>

    <!-- Episode 1 — The Dream Series: Signal in the Static -->
    <div class="screen">
      <iframe
        src="https://www.youtube-nocookie.com/embed/Nn314wzfWYI"
        title="The Dream Series: Signal in the Static"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>
    </div>
    <div class="entry-meta">
      <span class="entry-note">Episode 1 &middot; 3:31</span>
    </div>

    <a class="back-link" href="index.html">&laquo; Portal</a>
  </div>
</body>
</html>
