openapi: 3.0.3
info:
  title: Incompetech Music Catalog API
  version: 1.0.0
  description: >
    An API for accessing Kevin MacLeod's music catalog, metadata, and licensing information.
    This documentation is designed for autonomous agents and AI tools.
servers:
  - url: https://incompetech.com/music/royalty-free
paths:
  /pieces:
    get:
      summary: Retrieve a list of music pieces
      operationId: listPieces
      responses:
        '200':
          description: A JSON array of music pieces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pieces'
  /genre:
    get:
      summary: Retrieve a list of genres
      operationId: listGenres
      responses:
        '200':
          description: A JSON array of genre objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreList'
  /collections:
    get:
      summary: Retrieve a list of collections
      operationId: listCollections
      responses:
        '200':
          description: A JSON array of collection objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionsList'
components:
  schemas:
    Piece:
      type: object
      properties:
        uuid:
          type: string
        title:
          type: string
        filename:
          type: string
        length:
          type: string
          description: Duration formatted as "hh:mm:ss"
          pattern: '^\d{2}:\d{2}:\d{2}$'
        instruments:
          type: string
        genre:
          type: string
          description: Genre ID (see /genre)
        bpm:
          type: integer
          nullable: true
          description: Beats per minute (0 or null for unmetered music)
        description:
          type: string
        feel:
          type: string
          description: Mood or vibe of the piece
        uploaded:
          type: string
          format: date
        isrc:
          type: string
        collection:
          type: string
          description: Collection ID (see /collections)
        sheetmusic:
          type: string
          nullable: true
        video:
          type: string
          format: uri
          nullable: true
        itunes:
          type: string
          format: uri
          nullable: true
        wav:
          type: string
          format: uri
          nullable: true
        filmmusicURL:
          type: string
          format: uri
          nullable: true
      required:
        - uuid
        - title
        - filename
        - length
        - instruments
        - genre
        - bpm
        - description
        - feel
        - uploaded
        - isrc
        - collection
    Pieces:
      type: array
      items:
        $ref: '#/components/schemas/Piece'
    GenreItem:
      type: object
      properties:
        id:
          type: integer
        genre:
          type: string
      required:
        - id
        - genre
    GenreList:
      type: array
      items:
        $ref: '#/components/schemas/GenreItem'
      description: List of genres.
    CollectionItem:
      type: object
      properties:
        id:
          type: string
        collection_name:
          type: string
        collection_category:
          type: string
        code:
          type: string
      required:
        - id
        - collection_name
        - collection_category
        - code
    CollectionsList:
      type: array
      items:
        $ref: '#/components/schemas/CollectionItem'
      description: List of collections.


