<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VitaminaHueso – Splash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    /* Cinematic letterbox: video keeps its aspect, black fills the rest */
    #splash-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    /* Skip pill — matches the login button design language */
    #skip-btn {
      position: fixed;
      left: 50%;
      bottom: 5vh;
      transform: translateX(-50%);
      z-index: 10;
      padding: 15px 52px;
      font-size: 18px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #cfe4ff;
      background: rgba(8, 14, 24, 0.6);
      border: 1px solid rgba(120, 180, 255, 0.6);
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.25s ease;
      animation: skipulse 2.6s ease-in-out infinite;
    }
    #skip-btn:hover {
      color: #ffffff;
      background: rgba(20, 40, 70, 0.85);
      border-color: rgba(160, 210, 255, 0.95);
      box-shadow: 0 0 26px rgba(80, 150, 255, 0.5);
      animation-play-state: paused;
    }
    @keyframes skipulse {
      0%, 100% { box-shadow: 0 0 8px rgba(80, 150, 255, 0.15); }
      50%      { box-shadow: 0 0 22px rgba(80, 150, 255, 0.45); }
    }
    /* Shown only if the browser blocks autoplay with sound */
    #play-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
    }
    #play-overlay button {
      padding: 18px 70px;
      font-size: 22px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #cfe4ff;
      background: rgba(8, 14, 24, 0.7);
      border: 1px solid rgba(120, 180, 255, 0.7);
      border-radius: 999px;
      cursor: pointer;
    }
    #play-overlay button:hover {
      color: #fff;
      box-shadow: 0 0 28px rgba(80, 150, 255, 0.5);
    }
  </style>
</head>
<body>
  <video id="splash-video" src="splash.mp4" autoplay playsinline preload="auto"></video>

  <button id="skip-btn">Skip &raquo;</button>

  <div id="play-overlay">
    <button id="play-btn">&#9654; Play</button>
  </div>

  <script>
    const video = document.getElementById('splash-video');
    const overlay = document.getElementById('play-overlay');

    const go = () => { window.location.href = 'game.html'; };

    // When the splash ends (or the visitor skips), continue to game.html
    video.addEventListener('ended', go);
    document.getElementById('skip-btn').addEventListener('click', go);

    // Autoplay with sound is only allowed after a user gesture — arriving
    // from the ENTER click usually counts, but if the browser blocks it,
    // offer a one-tap start instead of a silent video.
    video.play().catch(() => { overlay.style.display = 'flex'; });
    document.getElementById('play-btn').addEventListener('click', () => {
      overlay.style.display = 'none';
      video.play();
    });
  </script>
</body>
</html>
