<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Vitamina Hueso @ Manteca Studios – Orbit Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#04070d" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    <style>
        /* This patch centers the third button perfectly underneath the first two */
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px; /* Keeps the spacing consistent */
            max-width: 500px; /* Prevents layout stretching */
            margin: 0 auto;
        }
        .full-width-btn-wrapper {
            flex-basis: 100%;
            display: flex;
            justify-content: center;
            margin-top: 5px;
        }
        .full-width-btn-wrapper .side-btn {
            min-width: 220px; /* Matches the visual weight of the top buttons */
            text-decoration: none;
            text-align: center;
        }

        /* Site banner (anthonitus.png) — first element INSIDE the centered
           column, so banner + buttons flow as one stack and can never
           overlap, whatever the viewport height */
        .site-banner {
            pointer-events: auto;
            margin: 0 auto 18px;
            line-height: 0;
        }
        #site-banner-img {
            display: block;
            margin: 0 auto;
            width: min(380px, 72vw);
            height: auto;
            filter: drop-shadow(0 0 18px rgba(80, 150, 255, 0.35));
        }

        /* PLAY art button — sized and glowing exactly like the landing page art */

        /* PLAY title art — identical spec to the landing page's art */
        .play-art-link {
            pointer-events: auto; /* #landing-page is click-through for the 3D orbit */
            display: block;
            margin-bottom: 16px;
            text-align: center;
            line-height: 0;
        }
        #play-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .play-art-link:hover #play-art-img {
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5); /* same glow as landing .btn:hover */
        }

        /* CRAZY ALGORITHM art button — same spec as the other art buttons */
        .ca-art-link {
            pointer-events: auto;
            display: block;
            text-align: center;
            line-height: 0;
        }
        #ca-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .ca-art-link:hover #ca-art-img {
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5);
        }

        /* MY MUSIC link — chip under the buttons (BandLab albums page) */
        .music-link {
            pointer-events: auto;
            display: block;
            margin: 22px auto 0;
            width: min(150px, 34vw);
            line-height: 0;
            opacity: 0.85;
            transition: opacity 0.2s ease, filter 0.2s ease;
        }
        .music-link:hover { opacity: 1; filter: drop-shadow(0 0 12px rgba(180, 90, 255, 0.6)); }
        #music-img { display: block; width: 100%; height: auto; }

        /* MOVIES art button — same spec as the PLAY art button */
        .movies-art-link {
            pointer-events: auto;
            display: block;
            text-align: center;
            line-height: 0;
        }
        #movies-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .movies-art-link:hover #movies-art-img {
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5);
        }

        /* HEMISYNC art button — same spec as the other art buttons */
        .hs-art-link {
            pointer-events: auto;
            display: block;
            text-align: center;
            line-height: 0;
        }
        #hs-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .hs-art-link:hover #hs-art-img {
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5);
        }

        /* FIT-TO-SCREEN OVERRIDES (must stay last — they win the cascade).
           Five art buttons + banner + chip overflowed fixed-height screens:
           the portal clips (overflow:hidden) and can't scroll. Art now scales
           with the viewport (15vh per button), the whole stack fits typical
           screens, and a tiny screen gets an internal scroll instead of
           clipping. The Spotify chip uses the SAME sizing as the buttons so
           it matches them on every device. */
        #landing-page {
            max-height: 100vh;
            max-height: 100dvh;   /* mobile: excludes the URL bar */
            overflow-y: auto;
            scrollbar-width: none;
            padding: 10px 6px;
        }
        #landing-page::-webkit-scrollbar { display: none; }
        .button-container { gap: 10px; }
        .full-width-btn-wrapper { margin-top: 0; }
        #site-banner-img { width: min(330px, 60vw); }
        #play-art-img, #movies-art-img, #hs-art-img, #ca-art-img, #tya-art-img, #hunters-art-img, #music-img {
            display: block;
            margin: 0 auto;   /* keep the chip centered under the column */
            width: auto;
            height: auto;
            max-width: min(200px, 46vw);
            max-height: clamp(88px, 15vh, 160px);
        }
        .music-link { width: auto; }
    </style>
</head>
<body>
    <canvas id="vh-canvas"></canvas>

    <div id="landing-page">
        <div class="site-banner">
            <img src="anthonitus.png" alt="Anthonitus" id="site-banner-img" />
        </div>
        <div class="button-container">

            <!-- Sobre El Gelo / Over The Ice — the saucer game -->
            <div class="full-width-btn-wrapper">
                <a href="splash.html" class="play-art-link" id="play-over-the-ice" aria-label="Play Over The Ice">
                    <img src="playovertheicebutton.png" alt="Play Over The Ice" id="play-art-img" />
                </a>
            </div>

            <!-- Movies — the free film library -->
            <div class="full-width-btn-wrapper">
                <a href="movies.html" class="movies-art-link" id="movies-button" aria-label="Movies – free film library">
                    <img src="moviesbutton.png" alt="Movies – free film library" id="movies-art-img" />
                </a>
            </div>

            <!-- Hemisync — chakra tone sanctuary -->
            <div class="full-width-btn-wrapper">
                <a href="hemisync.html" class="hs-art-link" id="hemisync-button" aria-label="Hemisync – chakra tone sanctuary">
                    <img src="hemisync.png" alt="Hemisync – chakra tone sanctuary" id="hs-art-img" />
                </a>
            </div>

            <!-- Crazy Algorithm — a different way to browse YouTube -->
            <div class="full-width-btn-wrapper">
                <a href="crazy.html" class="ca-art-link" id="crazy-button" aria-label="Crazy Algorithm Tube – a different way to browse YouTube">
                    <img src="crazyalgo.png" alt="Crazy Algorithm Tube – a different way to browse YouTube" id="ca-art-img" />
                </a>
            </div>

            <!-- Train Your Alien — raise a little cosmic friend -->
            <div class="full-width-btn-wrapper">
                <a href="trainyouralien.html" class="ca-art-link" id="tya-button" aria-label="Train Your Alien – raise a little cosmic friend">
                    <img src="trainyouralien/trainyouralien.png" alt="Train Your Alien – raise a little cosmic friend" id="tya-art-img" />
                </a>
            </div>

            <!-- THE HUNTERS — the gods hunt small souls in dead Hollywood -->
            <div class="full-width-btn-wrapper">
                <a href="thehunters.html" class="ca-art-link" id="hunters-button" aria-label="The Hunters – a game made for giant gods, that hunt small souls">
                    <img src="thehunters/thehunters.jpg" alt="The Hunters – a game made for giant gods, that hunt small souls" id="hunters-art-img" />
                </a>
            </div>
        </div>

        <!-- MY MUSIC — the fivetilogy on BandLab -->
        <a class="music-link" id="music-artist-link" href="mymusic.html" aria-label="My Music – the five albums on BandLab"
           title="My Music — the five-chapter saga on BandLab">
            <img src="mymusic.png" alt="My Music" id="music-img" />
        </a>
    </div>	<script type="module" src="main.js"></script>
	<script src="portal-music.js?v=5"></script>
	<script src="install.js?v=1"></script>
</body>
</html>
