<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>VitaminaHueso â€“ Orbit Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    <style>
        /* This patch centers the third button perfectly underneath the first two */
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px; /* Keeps the spacing consistent */
            max-width: 500px; /* Prevents layout stretching */
            margin: 0 auto;
        }
        .full-width-btn-wrapper {
            flex-basis: 100%;
            display: flex;
            justify-content: center;
            margin-top: 5px;
        }
        .full-width-btn-wrapper .side-btn {
            min-width: 220px; /* Matches the visual weight of the top buttons */
            text-decoration: none;
            text-align: center;
        }

        /* PLAY art button — sized and glowing exactly like the landing page art */

        /* PLAY title art — identical spec to the landing page's art */
        .play-art-link {
            pointer-events: auto; /* #landing-page is click-through for the 3D orbit */
            display: block;
            margin-bottom: 16px;
            text-align: center;
            line-height: 0;
        }
        #play-art-img {
            display: block;
            max-width: 340px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .play-art-link:hover #play-art-img {
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5); /* same glow as landing .btn:hover */
        }
    </style>
</head>
<body>
    <canvas id="vh-canvas"></canvas>

    <div id="landing-page">
        <div class="button-container">

            <!-- Sobre El Gelo / Over The Ice — the saucer game -->
            <div class="full-width-btn-wrapper">
                <a href="splash.html" class="play-art-link" id="play-over-the-ice" aria-label="Play Over The Ice">
                    <img src="playovertheicebutton.png" alt="Play Over The Ice" id="play-art-img" />
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
