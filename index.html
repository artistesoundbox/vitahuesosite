<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>VitaminaHueso â€“ Orbit Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    <style>
        /* This patch centers the third button perfectly underneath the first two */
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px; /* Keeps the spacing consistent */
            max-width: 500px; /* Prevents layout stretching */
            margin: 0 auto;
        }
        .full-width-btn-wrapper {
            flex-basis: 100%;
            display: flex;
            justify-content: center;
            margin-top: 5px;
        }
        .full-width-btn-wrapper .side-btn {
            min-width: 220px; /* Matches the visual weight of the top buttons */
            text-decoration: none;
            text-align: center;
        }

        /* PLAY button — same design language as the game landing's login button */
        #play-over-the-ice {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 15px 52px;
            font-size: 18px;
            letter-spacing: 0.32em;
            color: #cfe4ff;
            background: rgba(8, 14, 24, 0.6);
            border: 1px solid rgba(120, 180, 255, 0.6);
            border-radius: 999px;
            backdrop-filter: blur(6px);
            animation: playpulse 2.6s ease-in-out infinite;
        }
        #play-over-the-ice:hover {
            color: #ffffff;
            background: rgba(20, 40, 70, 0.85);
            border-color: rgba(160, 210, 255, 0.95);
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5);
            animation-play-state: paused;
        }
        @keyframes playpulse {
            0%, 100% { box-shadow: 0 0 8px rgba(80, 150, 255, 0.15); }
            50%      { box-shadow: 0 0 22px rgba(80, 150, 255, 0.45); }
        }
    </style>
</head>
<body>
    <canvas id="vh-canvas"></canvas>

    <div id="landing-page">
        <div class="button-container">

            <!-- Sobre El Gelo / Over The Ice — the saucer game -->
            <div class="full-width-btn-wrapper">
                <a href="splash.html" class="side-btn" id="play-over-the-ice">PLAY OVER THE ICE</a>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
