<html lang="en">
<head>

    <meta charset="UTF-8" />
    <title>Vitamina Hueso @ Manteca Studios – Orbit Portal</title>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }

    <style>
        /* Icon grid: 4 per row, left to right (banner above, labels under each) */
        .button-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 30px 26px;
            max-width: 560px;
            margin: 0 auto;
            align-items: start;
            justify-items: center;
        }

        /* Site banner (anthonitus.png) — first element INSIDE the centered
           column, so banner + buttons flow as one stack and can never
           overlap, whatever the viewport height */
        .site-banner {
            pointer-events: auto;
            margin: 0 auto 18px;
            line-height: 0;
        }
        #site-banner-img {
            display: block;
            margin: 0 auto;
            width: min(380px, 72vw);
            height: auto;
            filter: drop-shadow(0 0 18px rgba(80, 150, 255, 0.35));
        }

        /* PLAY art button — sized and glowing exactly like the landing page art */

        /* PLAY title art — identical spec to the landing page's art */
        .play-art-link {
            pointer-events: auto; /* #landing-page is click-through for the 3D orbit */
            display: block;
            margin-bottom: 16px;
            text-align: center;
            line-height: 0;
        }
        #play-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .play-art-link:hover #play-art-img {
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5); /* same glow as landing .btn:hover */
        }

        /* CRAZY ALGORITHM art button — same spec as the other art buttons */
        .ca-art-link {
            pointer-events: auto;
            display: block;
            text-align: center;
            line-height: 0;
        }
        #ca-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .ca-art-link:hover #ca-art-img {
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5);
        }

        /* GOD'S EYE VIEW art button — same spec as the other art buttons */
        #gev-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .ca-art-link:hover #gev-art-img {
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5);
        }

        /* SQUISHY art button — same spec, pink glow to match the blob */
        #sq-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(255, 100, 160, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .ca-art-link:hover #sq-art-img {
            box-shadow: 0 0 26px rgba(255, 130, 175, 0.6);
        }

        /* MY MUSIC link — chip under the buttons (BandLab albums page) */
        .music-link {
            pointer-events: auto;
            display: block;
            margin: 22px auto 0;
            width: min(150px, 34vw);
            line-height: 0;
            opacity: 0.85;
            transition: opacity 0.2s ease, filter 0.2s ease;
        }
        .music-link:hover { opacity: 1; filter: drop-shadow(0 0 12px rgba(180, 90, 255, 0.6)); }
        #music-img { display: block; width: 100%; height: auto; }

        /* MOVIES art button — same spec as the PLAY art button */
        .movies-art-link {
            pointer-events: auto;
            display: block;
            text-align: center;
            line-height: 0;
        }
        #movies-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .movies-art-link:hover #movies-art-img {
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5);
        }

        /* HEMISYNC art button — same spec as the other art buttons */
        .hs-art-link {
            pointer-events: auto;
            display: block;
            text-align: center;
            line-height: 0;
        }
        #hs-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .hs-art-link:hover #hs-art-img {
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5);
        }

        /* FIT-TO-SCREEN OVERRIDES (must stay last — they win the cascade).
           Five art buttons + banner + chip overflowed fixed-height screens:
           the portal clips (overflow:hidden) and can't scroll. Art now scales
           with the viewport (15vh per button), the whole stack fits typical
           screens, and a tiny screen gets an internal scroll instead of
           clipping. The Spotify chip uses the SAME sizing as the buttons so
           it matches them on every device. */
        #landing-page {
            max-height: 100vh;
            max-height: 100dvh;   /* mobile: excludes the URL bar */
            overflow-y: auto;
            scrollbar-width: none;
            padding: 10px 6px;
        }
        #landing-page::-webkit-scrollbar { display: none; }
        .button-container { gap: 30px 26px; }
        .music-link { width: auto; margin: 0; }
        #site-banner-img { width: min(330px, 60vw); }
        #play-art-img, #movies-art-img, #hs-art-img, #ca-art-img, #tya-art-img, #seb-art-img, #sst-art-img, #gev-art-img, #sq-art-img, #music-img {
            display: block;
            margin: 0 auto;   /* keep the chip centered under the column */
            width: auto;
            height: auto;
            max-width: min(100%, 175px);
            max-height: clamp(88px, 15vh, 160px);
        }
        .music-link { width: auto; }

        /* Icon titles — small navy Courier labels under each art button */
        .art-label {
            display: block;
            margin-top: 5px;
            font-family: "Courier New", Courier, monospace;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.08em;
            color: #f2f7ff;
            text-align: center;
            text-shadow: 0 0 5px rgba(10, 22, 48, 0.95), 0 0 10px rgba(10, 22, 48, 0.8), 0 2px 4px rgba(4, 7, 13, 0.9);
        }

        /* Phones: 2 icons per row, bigger art, roomier breathing space */
        @media (max-width: 640px) {
            .button-container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 30px 18px;
                max-width: 560px;
            }
            #play-art-img, #movies-art-img, #hs-art-img, #ca-art-img, #tya-art-img, #seb-art-img, #sst-art-img, #gev-art-img, #sq-art-img, #music-img {
                max-width: min(100%, 210px);
                max-height: clamp(110px, 19vh, 190px);
            }
            .art-label { font-size: 12px; letter-spacing: 0.06em; }
        }
    </style>
</head>
<body>
    <canvas id="vh-canvas"></canvas>

            <!-- Sobre El Gelo / Over The Ice — the saucer game -->

            <!-- Movies — the free film library -->

            <!-- SQUISHY — the soft-body toy blob -->

                <a href="squishy.html" class="ca-art-link" id="sq-button" aria-label="Squishy – a soft cosmic blob you can squash">

            <!-- SEBLERSKERS — the viking island saga -->

                    <img src="seblerskers.png" alt="SEBLERSKERS – the viking island saga" id="seb-art-img" />

            <!-- Silent Sound Theater — the Dream Series screening room -->

                <a href="silentsoundtheater.html" class="ca-art-link" id="sst-button" aria-label="Silent Sound Theater – films made of music">
                    <img src="silent.sound.theater.icon.png?v=3" alt="Silent Sound Theater" id="sst-art-img" />

            <!-- God's Eye View — the live intelligence console -->

                <a href="gods-eye-view/" class="ca-art-link" id="gods-eye-button" aria-label="God's Eye View – live intelligence console">
                    <img src="godseyeicon.png" alt="God's Eye View" id="gev-art-img" />
                    <span class="art-label">God's Eye View</span>
                </a>

        <!-- MY MUSIC — the fivetilogy on BandLab -->
        <a class="music-link" id="music-artist-link" href="mymusic.html" aria-label="My Music – the five albums on BandLab"
           title="My Music — the five-chapter saga on BandLab">
            <img src="mymusic.png" alt="My Music" id="music-img" />
            <span class="art-label">My Music</span>
        </a>
        </div>
    </div>
	<div style="max-width: 900px; margin: 42px auto 26px; padding: 0 6vw; text-align: center; color: #7f6f7d; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;">Under Development</div>

	<script src="portal-music.js?v=5"></script>
