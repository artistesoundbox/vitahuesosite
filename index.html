<!DOCTYPE html>
<html lang="en">
<head>

    <script>

    <meta charset="UTF-8" />
    <title>Vitamina Hueso @ Manteca Studios – Orbit Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#04070d" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    <style>
        /* Icon grid: 3 per row, left to right (banner above, labels under each).
           Eleven icons plus the music chip is twelve at three across — exactly
           four full rows rather than five, so the stack stays shorter than it was
           — which the fit-to-screen rules at the bottom of this block like. */
        .button-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 26px 20px;
            max-width: 780px;
            margin: 0 auto;
            align-items: start;
            justify-items: center;
        }

        /* Site banner (anthonitus.png) — first element INSIDE the centered
           column, so banner + buttons flow as one stack and can never
           overlap, whatever the viewport height */
        .site-banner {
            pointer-events: auto;
            margin: 0 auto 18px;
            line-height: 0;
        }
        #site-banner-img {
            display: block;
            margin: 0 auto;
            width: min(380px, 72vw);
            height: auto;
            filter: drop-shadow(0 0 18px rgba(80, 150, 255, 0.35));
        }

        /* PLAY art button — sized and glowing exactly like the landing page art */

        /* PLAY title art — identical spec to the landing page's art */
        .play-art-link {
            pointer-events: auto; /* #landing-page is click-through for the 3D orbit */
            display: block;
            margin-bottom: 16px;
            text-align: center;
            line-height: 0;
        }
        #play-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .play-art-link:hover #play-art-img {
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5); /* same glow as landing .btn:hover */
        }

        /* CRAZY ALGORITHM art button — same spec as the other art buttons */
        .ca-art-link {
            pointer-events: auto;
            display: block;
            text-align: center;
            line-height: 0;
        }
        #ca-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .ca-art-link:hover #ca-art-img {
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5);
        }

        /* GOD'S EYE VIEW art button — same spec as the other art buttons */
        #gev-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .ca-art-link:hover #gev-art-img {
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5);
        }

        /* CITY GRAND PRIX art button — amber/cyan glow, to match the game's
           neon and its boost arrows */
        #gp-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(255, 194, 71, 0.32);
            transition: box-shadow 0.25s ease;
        }
        .ca-art-link:hover #gp-art-img {
            box-shadow: 0 0 26px rgba(120, 255, 220, 0.55);
        }

        /* SQUISHY art button — same spec, pink glow to match the blob */
        #sq-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(255, 100, 160, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .ca-art-link:hover #sq-art-img {
            box-shadow: 0 0 26px rgba(255, 130, 175, 0.6);
        }

        /* A BROKEN BOOT ON THE BRAVE art button — warm amber glow, to match the
           game's tracers and its boot banner. The icon is the game's own, kept
           where the game lives rather than copied to the root */
        #bb-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(255, 176, 96, 0.32);
            transition: box-shadow 0.25s ease;
        }
        .ca-art-link:hover #bb-art-img {
            box-shadow: 0 0 26px rgba(255, 205, 140, 0.6);
        }

        /* RADIO FOOTER — vitahuesoradioicon.png at the bottom of the portal
           column. It is the doorway into the live station (customizer,
           listener room, chat, requests) and doubles as the site-wide radio
           switch: site-radio.js turns the dock on when it is opened. */
        .radio-footer {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 14px;
            width: min(560px, 100%);
            margin: 26px auto 8px;
            padding: 12px 16px 12px 12px;
            border-radius: 16px;
            border: 1px solid rgba(90, 180, 255, 0.42);
            /* Nearly opaque: the 3D city runs on behind it and fine Courier
               text needs a solid bed to stay readable. */
            background: linear-gradient(140deg, rgba(90, 175, 255, 0.18), rgba(4, 9, 18, 0.94) 55%), rgba(4, 9, 18, 0.94);
            backdrop-filter: blur(12px) saturate(130%);
            -webkit-backdrop-filter: blur(12px) saturate(130%);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5), 0 0 22px rgba(56, 160, 255, 0.18);
            text-decoration: none;
            text-align: left;
            transition: border-color 0.22s ease, box-shadow 0.22s ease, transform 0.22s ease;
        }
        .radio-footer:hover,
        .radio-footer:focus-visible {
            border-color: rgba(140, 225, 255, 0.9);
            box-shadow: 0 0 30px rgba(80, 190, 255, 0.4);
            transform: translateY(-2px);
            outline: none;
        }
        #radio-footer-img {
            flex: none;
            display: block;
            width: clamp(52px, 8vh, 78px);
            height: auto;
            border-radius: 12px;
            filter: drop-shadow(0 0 12px rgba(80, 170, 255, 0.5));
        }
        .radio-footer-copy {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .radio-footer-kicker {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: "Courier New", Courier, monospace;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #6ee7ff;
        }
        .radio-footer-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #6ee7ff;
            box-shadow: 0 0 8px #38b6ff;
        }
        html.vhr-on .radio-footer-dot {
            background: #ff4d7d;
            box-shadow: 0 0 9px #ff4d7d;
            animation: radio-footer-pulse 1.8s ease-in-out infinite;
        }
        @keyframes radio-footer-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        .radio-footer-title {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 18px;
            letter-spacing: 0.02em;
            color: #f2f7ff;
            text-shadow: 0 0 10px rgba(10, 22, 48, 0.9);
        }
        .radio-footer-sub {
            font-family: "Courier New", Courier, monospace;
            font-size: 10.5px;
            line-height: 1.45;
            letter-spacing: 0.03em;
            color: #a8bfd9;
        }
        .radio-footer-go {
            flex: none;
            margin-left: auto;
            padding-left: 6px;
            font-size: 20px;
            color: #8fd8ff;
            transition: transform 0.22s ease, color 0.22s ease;
        }
        .radio-footer:hover .radio-footer-go { transform: translateX(3px); color: #eaf7ff; }

        /* MY MUSIC link — chip under the buttons (BandLab albums page) */
        .music-link {
            pointer-events: auto;
            display: block;
            margin: 22px auto 0;
            width: min(150px, 34vw);
            line-height: 0;
            opacity: 0.85;
            transition: opacity 0.2s ease, filter 0.2s ease;
        }
        .music-link:hover { opacity: 1; filter: drop-shadow(0 0 12px rgba(180, 90, 255, 0.6)); }
        #music-img { display: block; width: 100%; height: auto; }

        /* MOVIES art button — same spec as the PLAY art button */
        .movies-art-link {
            pointer-events: auto;
            display: block;
            text-align: center;
            line-height: 0;
        }
        #movies-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .movies-art-link:hover #movies-art-img {
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5);
        }

        /* HEMISYNC art button — same spec as the other art buttons */
        .hs-art-link {
            pointer-events: auto;
            display: block;
            text-align: center;
            line-height: 0;
        }
        #hs-art-img {
            display: block;
            max-width: 215px;
            width: 100%;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            box-shadow: 0 0 22px rgba(80, 150, 255, 0.35);
            transition: box-shadow 0.25s ease;
        }
        .hs-art-link:hover #hs-art-img {
            box-shadow: 0 0 26px rgba(80, 150, 255, 0.5);
        }

        /* FIT-TO-SCREEN OVERRIDES (must stay last — they win the cascade).
           Five art buttons + banner + chip overflowed fixed-height screens:
           the portal clips (overflow:hidden) and can't scroll. Art now scales
           with the viewport (15vh per button), the whole stack fits typical
           screens, and a tiny screen gets an internal scroll instead of
           clipping. The Spotify chip uses the SAME sizing as the buttons so
           it matches them on every device. */
        #landing-page {
            /* Centered while the column fits, scrollable from the TOP when it
               does not. The old top:50% / translate(-50%,-50%) centre clipped
               the start of the stack on short screens — the "Enable radio"
               pill sat half off-screen and could not be reached. `safe center`
               falls back to flex-start on overflow, so nothing is cut off. */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            transform: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            justify-content: safe center;
            box-sizing: border-box;
            max-height: none;
            overflow-y: auto;
            scrollbar-width: none;
            padding: 14px 8px 24px;   /* tail room under the radio card */
        }
        #landing-page::-webkit-scrollbar { display: none; }
        .button-container { gap: 30px 26px; }
        .music-link { width: auto; margin: 0; }
        #site-banner-img { width: min(330px, 60vw); }
        #play-art-img, #movies-art-img, #hs-art-img, #ca-art-img, #tya-art-img, #seb-art-img, #sst-art-img, #gev-art-img, #sq-art-img, #gp-art-img, #bb-art-img, #music-img {
            display: block;
            margin: 0 auto;   /* keep the chip centered under the column */
            width: auto;
            height: auto;
            max-width: min(100%, 175px);
            max-height: clamp(88px, 15vh, 160px);
        }
        .music-link { width: auto; }

        /* Icon titles — small navy Courier labels under each art button */
        .art-label {
            display: block;
            margin-top: 5px;
            font-family: "Courier New", Courier, monospace;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.08em;
            color: #f2f7ff;
            text-align: center;
            text-shadow: 0 0 5px rgba(10, 22, 48, 0.95), 0 0 10px rgba(10, 22, 48, 0.8), 0 2px 4px rgba(4, 7, 13, 0.9);
        }

        /* Phones: still three across — the column is narrower, so the art is
           capped by the same fit-to-screen heights and the labels shrink. */
        @media (max-width: 640px) {
            .button-container {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 22px 10px;
                max-width: 560px;
            }
            #play-art-img, #movies-art-img, #hs-art-img, #ca-art-img, #tya-art-img, #seb-art-img, #sst-art-img, #gev-art-img, #sq-art-img, #gp-art-img, #bb-art-img, #music-img {
                max-width: min(100%, 210px);
                max-height: clamp(110px, 19vh, 190px);
            }
            .art-label { font-size: 11px; letter-spacing: 0.04em; }
            .radio-footer { gap: 11px; padding: 10px 12px 10px 10px; margin-top: 20px; }
            .radio-footer-title { font-size: 15.5px; }
            .radio-footer-sub { font-size: 9.5px; }
            .radio-footer-go { font-size: 17px; }
        }
    </style>
</head>
<body>
    <canvas id="vh-canvas"></canvas>

    <div id="landing-page">
        <!-- 24/7 station: mutes the welcome loop and hands over to the site-wide
             radio dock. Styles are injected by webradio/site-radio.js. -->
        <button id="vh-enable-radio" type="button" aria-pressed="false" title="Enable the 24/7 radio">
            <span class="vhr-btn-dot" aria-hidden="true"></span>
            <span class="vhr-btn-label">Enable radio</span>
        </button>

        <div class="site-banner">
            <img src="anthonitus.png" alt="Anthonitus" id="site-banner-img" />
        </div>

        <div class="button-container">

            <!-- Sobre El Gelo / Over The Ice — the saucer game -->

                <a href="splash.html" class="play-art-link" id="play-over-the-ice" aria-label="Play Over The Ice">
                    <img src="playovertheicebutton.png" alt="Play Over The Ice" id="play-art-img" />
                    <span class="art-label">Sobre El Gelo</span>
                </a>

            <!-- Movies — the free film library -->

                <a href="movies.html" class="movies-art-link" id="movies-button" aria-label="Movies – free film library">
                    <img src="moviesbutton.png" alt="Movies – free film library" id="movies-art-img" />
                    <span class="art-label">Movies</span>
                </a>

            <!-- Hemisync — chakra tone sanctuary -->

                <a href="hemisync.html" class="hs-art-link" id="hemisync-button" aria-label="Hemisync – chakra tone sanctuary">
                    <img src="hemisync.png" alt="Hemisync – chakra tone sanctuary" id="hs-art-img" />
                    <span class="art-label">Hemi-sync</span>
                </a>

            <!-- Crazy Algorithm — a different way to browse YouTube -->

                <a href="crazy.html" class="ca-art-link" id="crazy-button" aria-label="Crazy Tube – a different way to browse YouTube">
                    <img src="crazyalgo.png" alt="Crazy Tube – a different way to browse YouTube" id="ca-art-img" />
                    <span class="art-label">Crazy Tube</span>
                </a>

            <!-- Train Your Alien — raise a little cosmic friend -->

                <a href="trainyouralien.html" class="ca-art-link" id="tya-button" aria-label="Train Your Alien – raise a little cosmic friend">
                    <img src="trainyouralien/trainyouralien.png" alt="Train Your Alien – raise a little cosmic friend" id="tya-art-img" />
                    <span class="art-label">Train Your Alien</span>
                </a>

            <!-- SQUISHY — the soft-body toy blob -->

                <a href="squishy.html" class="ca-art-link" id="sq-button" aria-label="Squishy – a soft cosmic blob you can squash">
                    <img src="squishy.png" alt="Squishy – a soft cosmic blob" id="sq-art-img" />
                    <span class="art-label">Squishy</span>
                </a>

            <!-- SEBLERSKERS — the viking island saga -->

                <a href="seblerskers/index.html" class="ca-art-link" id="seb-button" aria-label="SEBLERSKERS – the viking island saga: fly, sail, raid">
                    <img src="seblerskers.png" alt="SEBLERSKERS – the viking island saga" id="seb-art-img" />
                    <span class="art-label">Seblerskers</span>
                </a>

            <!-- Silent Sound Theater — the Dream Series screening room -->

                <a href="silentsoundtheater.html" class="ca-art-link" id="sst-button" aria-label="Silent Sound Theater – films made of music">
                    <img src="silent.sound.theater.icon.png?v=3" alt="Silent Sound Theater" id="sst-art-img" />
                    <span class="art-label">Silent Sound Theater</span>
                </a>

            <!-- God's Eye View — the live intelligence console -->

                <a href="gods-eye-view/" class="ca-art-link" id="gods-eye-button" aria-label="God's Eye View – live intelligence console">
                    <img src="godseyeicon.png" alt="God's Eye View" id="gev-art-img" />
                    <span class="art-label">God's Eye View</span>
                </a>

            <!-- City Grand Prix — the aircraft racer through a live city -->

                <a href="racegame.html" class="ca-art-link" id="gp-button" aria-label="City Grand Prix – five aircraft race a generated city circuit">
                    <img src="racericon.png" alt="City Grand Prix – race the generated city" id="gp-art-img" />
                    <span class="art-label">City Grand Prix</span>
                </a>

            <!-- A Broken Boot On The Brave — the forest shooter: hold the clearing,
                 boot the attackers off the floating climb -->

                <a href="3rdshooter-abootonthebrave/brokenboot/index.html" class="ca-art-link" id="bb-button" aria-label="A Broken Boot On The Brave – hold the clearing and boot the attackers off the floating climb">
                    <img src="3rdshooter-abootonthebrave/abrookenbootonthebraveicon.png" alt="A Broken Boot On The Brave" id="bb-art-img" />
                    <span class="art-label">A Broken Boot</span>
                </a>

        <!-- MY MUSIC — the fivetilogy on BandLab -->
        <a class="music-link" id="music-artist-link" href="mymusic.html" aria-label="My Music – the five albums on BandLab"
           title="My Music — the five-chapter saga on BandLab">
            <img src="mymusic.png" alt="My Music" id="music-img" />
            <span class="art-label">My Music</span>
        </a>
        </div>

        <!-- VITA HUESO RADIO — the door into the 24/7 station: customize it,
             chat in the listener room, request a song. Opening it also turns
             the site radio on (site-radio.js), so the station keeps playing
             as you move around the site. -->
        <a class="radio-footer" id="vh-radio-footer" href="webradio/index.html#radio"
           data-radio-open aria-label="Vita Hueso Radio — open the 24/7 station to customize, chat and request songs"
           title="Vita Hueso Radio — 24/7 station, customizer, listener room">
            <img src="vitahuesoradioicon.png" alt="Vita Hueso Radio" id="radio-footer-img" />
            <span class="radio-footer-copy">
                <span class="radio-footer-kicker"><i class="radio-footer-dot" aria-hidden="true"></i>24/7 · Live</span>
                <span class="radio-footer-title">Vita Hueso Radio</span>
                <span class="radio-footer-sub">Open the station — customize it, chat in the listener room, request a song</span>
            </span>
            <span class="radio-footer-go" aria-hidden="true">→</span>
        </a>
    </div>
	<div style="max-width: 900px; margin: 42px auto 26px; padding: 0 6vw; text-align: center; color: #7f6f7d; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;">Under Development</div>
	<script src="signin.js"></script>
	<script type="module" src="main.js"></script>
	<script src="portal-music.js?v=6"></script>

</body>
