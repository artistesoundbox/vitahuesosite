<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Signal Sessions album artwork">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#0d2a4a"/>
      <stop offset="55%" stop-color="#050b16"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fe7ff"/>
      <stop offset="50%" stop-color="#2f9bff"/>
      <stop offset="100%" stop-color="#8b5cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke="url(#neon)" opacity="0.55">
    <circle cx="256" cy="214" r="150" stroke-width="1"/>
    <circle cx="256" cy="214" r="112" stroke-width="1"/>
    <circle cx="256" cy="214" r="74" stroke-width="1"/>
  </g>
  <g filter="url(#glow)">
    <path d="M150 250c26 0 26-46 52-46s26 92 52 92 26-120 52-120 26 74 52 74" fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g fill="#dfeeff" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="256" y="392" font-size="30" letter-spacing="9" font-weight="300">SIGNAL</text>
    <text x="256" y="428" font-size="15" letter-spacing="7" fill="#7fb6e6">SESSIONS · CC BY</text>
  </g>
  <g fill="#2f9bff" opacity="0.9" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="256" y="466" font-size="11" letter-spacing="4">GUEST INSTRUMENTALS</text>
  </g>
