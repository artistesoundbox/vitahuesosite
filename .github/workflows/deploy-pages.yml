# Deploy the whole vitahuesosite to GitHub Pages as a Actions artifact —
# INCLUDING game/index.pck as real bytes (313 MB).
#
# WHY THIS EXISTS
# The old delivery chain for the Over The Ice pack was GitHub LFS
# (media.githubusercontent.com). LFS free tier = 1 GB bandwidth/month and the
# pack alone is 328 MB — so ~3 player downloads a month exhaust it, every HEAD
# then 403s, the shell falls back to the same-origin copy, and that copy is a
# 134-byte LFS *pointer* that Godot chokes on. This workflow ships the pack
# the way the SEBLERSKERS CDN already does it: a Pages artifact built on the
# runner, which bypasses both the 100 MB git limit and LFS bandwidth entirely.
#
# ONE-TIME MANUAL STEP (repo owner):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Until that switch happens, this workflow may run but Pages keeps serving
# the old branch build (no regression, just no improvement yet).

name: Deploy vitahuesosite to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (with LFS smudge for the game pack)
        uses: actions/checkout@v4
        with:
          lfs: true

      # Node is pinned rather than taken from the runner image, because the step below
      # decides whether the check at the end of this workflow can be trusted at all and its
      # runtime should not drift under it. Same action and same version as the sync workflow.
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0

      # A guard that has gone blind cannot publish here. The entry-point check this workflow
      # ends with is only as good as the two lists that decide which launcher page opens
      # which game: narrowed by accident they do not fail — they PASS, because a way into a
      # pack game that the lists cannot see is never checked and the run still ends at 0.
      # So the check's own suites run first, on the checkout, before anything is published.
      # The entry-point suite builds a fixture with one launcher page per mechanism, drops
      # the check into it, and fails if a mechanism stops being seen, a deliberately narrowed
      # copy of the check included; the pack-guard suite fails if a worker stops refusing the
      # 134-byte LFS pointer. Neither suite touches the network — the fixture answers its own
      # requests from local servers — so this step costs seconds and cannot flake on somebody
      # else's host. Both are hand-run checks worth having in the one place that publishes.
      #
      # The third suite is the site's sign-in. auth/worker.js is a build artifact
      # (Auth.js is bundled into it) and the bundle is what gets deployed, so the
      # suite is run against the committed bytes rather than a fresh build, and it
      # fails if those bytes are not the bundle of auth/src/worker.src.js — editing
      # the source and forgetting `node build.mjs` is a red build, not a silent
      # regression. It needs no dependencies: the bundle already contains Auth.js.
      # Its `[auth][error]` lines are the refusals it asks for; the exit code is
      # the verdict. Same deal as the others: local servers only, no network.
      - name: Test the guard before it is trusted
        run: |
          set -euo pipefail
          node tools/test-pack-guard.mjs
          node tools/test-launch-sources.mjs
          node auth/test.mjs

      - name: Verify the pack arrived as real bytes
        run: |
          size=$(stat -c%s game/index.pck)
          echo "game/index.pck: $size bytes"
          if [ "$size" -lt 100000000 ]; then
            echo "::error::game/index.pck is an LFS pointer ($size bytes), not the real pack - check LFS storage/quota"
            exit 1
          fi

      # .git is not part of the site, and the sign-in Worker's dependency tree
      # is not part of anything — it is a build input (gitignored, and absent
      # from a fresh checkout anyway), and an artifact that carried it would be
      # publishing the library's source under /auth/node_modules/.
      - name: Trim working copy before packaging
        run: |
          rm -rf .git
          rm -rf auth/node_modules

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # By now the deploy has succeeded, which says nothing about what the host is
      # serving: an LFS pointer answers 200 with a plausible content type, and this
      # repo stores pointers for game/index.pck and 3rdpersonidle.fbx. The checkout
      # above is smudged and verified, so if the URLs answer with pointers the
      # publishing pipeline is not this artifact — Pages is sourcing the branch build
      # (Settings -> Pages -> Build and deployment -> Source). Waiting is for the CDN:
      # a fresh deploy can briefly answer with the previous build. This is a
      # deploy-time guard, not a monitor — the branch build can still overwrite the
      # artifact afterwards, and only the next run would notice.
      - name: Check the live site serves the real files
        run: node tools/check-live-assets.js --base="${{ steps.deployment.outputs.page_url }}" --wait=300
